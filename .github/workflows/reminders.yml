name: reminders

on:
  # PAUSED after the 2026 World Cup — no automatic emails until the next
  # tournament (2030). Re-enable by uncommenting the schedule below and updating
  # the cron/dates. Manual "Run workflow" still works via workflow_dispatch.
  # schedule:
  #   - cron: "*/15 * * * *" # every 15 min; the script no-ops until a reminder is due
  workflow_dispatch: {} # manual "Run workflow" button — still available

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts
      - run: node scripts/reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
