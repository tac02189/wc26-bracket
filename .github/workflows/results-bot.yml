name: results-bot

on:
  # PAUSED after the 2026 World Cup — no automatic data fetching until the next
  # tournament (2030). Re-enable by uncommenting the schedule below and updating
  # the cron/dates. Manual "Run workflow" still works via workflow_dispatch.
  # schedule:
  #   - cron: "*/30 * * * *" # every 30 min; GH may lag a few minutes — fine
  workflow_dispatch: {} # manual "Run workflow" button — still available

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts
      - run: node scripts/results-bot.mjs
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
